<svg xmlns="http://www.w3.org/2000/svg" width="800" height="4" viewBox="0 0 800 4">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.35" stop-color="#000000"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="800 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="800" height="4" rx="2" fill="url(#g)"/>
</svg>
